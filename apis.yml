name: Duna
description: 'Duna is an AI-native business identity platform for KYB (Know Your Business),
  KYC (Know Your Customer), AML (Anti-Money Laundering), and lifecycle compliance. It
  accelerates enterprise business onboarding by turning compliance policy into auditable
  code via a policy engine, using AI agents for document verification and periodic reviews,
  with deep localization across 210+ business registries and 7+ languages. Duna serves
  fintechs, banks, and platforms including Plaid, Moss, and Bol, and is backed by Index
  Ventures. Note: docs.duna.com is password-protected, so no public API reference,
  OpenAPI, or developer portal was available at enrichment time.'
